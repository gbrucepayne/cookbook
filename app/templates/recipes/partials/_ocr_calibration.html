<div class="grid" style="grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px;">
  
  <!-- Left Side: Interactive Slider Tuning Dashboard Grid -->
  <article style="padding: 20px;">
    <h3>🛠️ OCR Layout Calibration</h3>
    <p><small>Drag sliders to tune how lines melt into blocks. Avoid bridging the center column gap.</small></p>
    
    <label for="slider-k-width">Kernel Width: <span id="val-k-width">15</span>px</label>
    <input type="range" id="slider-k-width" min="5" max="50" value="15" oninput="updateOCRCalibration()">

    <label for="slider-k-height">Kernel Height: <span id="val-k-height">8</span>px</label>
    <input type="range" id="slider-k-height" min="2" max="25" value="8" oninput="updateOCRCalibration()">

    <label for="slider-y-tol">Row Y-Tolerance: <span id="val-y-tol">18</span>px</label>
    <input type="range" id="slider-y-tol" min="5" max="60" value="18" oninput="updateOCRCalibration()">

    <hr>
    <div style="font-size: 0.9rem; color: var(--pico-muted-color);">
      <div>Detected Text Blocks: <strong id="stat-boxes" style="color: var(--pico-primary);">0</strong></div>
      <div>Calculated Layout Rows: <strong id="stat-rows" style="color: var(--pico-primary);">0</strong></div>
    </div>
    
    <footer style="margin-top: 20px; padding: 0;">
      <button onclick="commitOCRAdjustment()" class="contrast" style="width: 100%;">Apply & Parse Text</button>
    </footer>
  </article>

  <!-- Right Side: Graphic Layer Canvas Canvas Overlay Sheet -->
  <div style="position: relative; display: inline-block; max-width: 100%;">
    <!-- Base Scan Image (Source Backdrop Layer) -->
    <img id="calibration-img" src="{{ url_for('static', filename='images/' + recipe.image_url) if recipe else '' }}" 
         style="display: block; width: 100%; height: auto; border-radius: 6px;" alt="Recipe Sheet">
         
    <!-- Translucent Overlay Canvas Frame tracking bounding boxes -->
    <canvas id="ocr-overlay-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
  </div>
</div>
