<fieldset class="small-switch container">
  <label for="cooking-mode-toggle" data-tooltip="Keep screen on (settings managed by your device)">
    <small>
      🍳 Cooking Mode
    </small>
    <input type="checkbox" 
      id="cooking-mode-toggle" 
      name="cooking-mode-toggle" 
      role="switch" 
      onclick="toggleCookingMode(this)"
    >
  </label>
</fieldset>
