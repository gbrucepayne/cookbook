[project]
name = "cookbook"
version = "0.1.0"
description = "A cookbook"
authors = [
    {name = "gbrucepayne@hotmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "flask-wtf (>=1.3.0,<2.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pillow-heif (>=1.5.0,<2.0.0)",
    "numpy (<2.0.0)",
    "opencv-python-headless (<4.11)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = ["BLE001", "FURB122", "SIM102"]
